<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Team 邀请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="email"], input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .message.loading {
            background: #e7f1ff;
            color: #004085;
            display: block;
        }
        .message.warning {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: modalIn 0.3s ease;
            margin: auto;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal h2 {
            color: #333;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .modal .price {
            color: #e74c3c;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .qrcode-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .qrcode-item {
            text-align: center;
        }
        .qrcode-item img {
            width: 140px;
            height: 140px;
            border-radius: 8px;
            border: 2px solid #eee;
        }
        .qrcode-item .qr-label {
            margin-top: 6px;
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }
        .qrcode-item .qr-label.wechat {
            color: #07c160;
        }
        .qrcode-item .qr-label.alipay {
            color: #1677ff;
        }
        .modal .tips {
            color: #666;
            font-size: 13px;
            margin-bottom: 12px;
            line-height: 1.8;
        }
        .modal .tips strong {
            color: #e74c3c;
        }
        .mobile-tip {
            background: #e7f1ff;
            color: #004085;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 12px;
        }
        .order-code {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            padding: 10px 20px;
            border-radius: 8px;
            margin: 12px 0;
            font-family: 'Courier New', monospace;
        }
        .order-hint {
            background: #fff3cd;
            color: #856404;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .modal .btn-group {
            display: flex;
            gap: 10px;
        }
        .modal .btn-group button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
        }
        .btn-cancel {
            background: #e0e0e0 !important;
            color: #333 !important;
        }
        .btn-cancel:hover {
            background: #d0d0d0 !important;
            box-shadow: none !important;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%) !important;
        }
        .btn-confirm:hover {
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4) !important;
        }
        .quota-info {
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }
        .quota-info.low {
            background: #fff3cd;
            color: #856404;
        }
        .quota-info.out {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ChatGPT Team</h1>
        <p class="subtitle">输入邮箱获取邀请链接</p>
        
        <div id="quotaInfo" class="quota-info" style="display: none;"></div>
        
        <form id="inviteForm">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com"
                    required
                >
            </div>
            <button type="submit" id="submitBtn">获取邀请</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="footer">
            提交后请查收邮件中的邀请链接
        </div>
    </div>

    <!-- 付款弹窗 -->
    <div id="paymentModal" class="modal-overlay">
        <div class="modal">
            <h2>扫码付款</h2>
            <div class="price">¥9.9</div>
            
            <div class="qrcode-container">
                <div class="qrcode-item">
                    <img src="https://pic.icon.pp.ua/wechat-pay.jpeg" alt="微信收款码">
                    <div class="qr-label wechat">微信支付</div>
                </div>
                <div class="qrcode-item">
                    <img src="https://pic.icon.pp.ua/alipay.jpeg" alt="支付宝收款码">
                    <div class="qr-label alipay">支付宝</div>
                </div>
            </div>
            
            <div class="mobile-tip">
                📱 手机用户：长按二维码保存图片，再用微信/支付宝扫码
            </div>
            
            <div class="tips">
                付款时请备注下方 <strong>订单号</strong>
            </div>
            
            <div class="order-hint">⚠️ 务必备注订单号，否则无法确认付款</div>
            <div class="order-code" id="orderCode">----</div>
            
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="closePaymentModal()">取消</button>
                <button type="button" class="btn-confirm" onclick="confirmPayment()">已完成付款</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('inviteForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const paymentModal = document.getElementById('paymentModal');
        const orderCodeDiv = document.getElementById('orderCode');
        const quotaInfoDiv = document.getElementById('quotaInfo');

        let currentEmail = '';
        let currentOrderCode = '';

        // 生成4位订单号
        function generateOrderCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        function hideMessage() {
            messageDiv.className = 'message';
        }

        // 检查库存
        async function checkQuota() {
            try {
                const response = await fetch('/api/quota');
                const data = await response.json();
                
                if (data.success) {
                    const quota = data.availableQuota;
                    if (quota <= 0) {
                        quotaInfoDiv.textContent = '⚠️ 当前名额已满，请稍后再试';
                        quotaInfoDiv.className = 'quota-info out';
                        quotaInfoDiv.style.display = 'block';
                        submitBtn.disabled = true;
                        submitBtn.textContent = '暂无名额';
                        return false;
                    } else if (quota <= 3) {
                        quotaInfoDiv.textContent = `🔥 剩余名额：${quota}，先到先得`;
                        quotaInfoDiv.className = 'quota-info low';
                        quotaInfoDiv.style.display = 'block';
                    } else {
                        quotaInfoDiv.style.display = 'none';
                    }
                    return true;
                }
                return true;
            } catch (error) {
                console.error('检查库存失败:', error);
                return true; // 出错时允许继续
            }
        }

        function openPaymentModal(email) {
            currentEmail = email;
            currentOrderCode = generateOrderCode();
            orderCodeDiv.textContent = currentOrderCode;
            paymentModal.classList.add('active');
        }

        function closePaymentModal() {
            paymentModal.classList.remove('active');
            submitBtn.disabled = false;
            submitBtn.textContent = '获取邀请';
        }

        async function confirmPayment() {
            closePaymentModal();
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            showMessage('正在提交订单...', 'loading');

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email: currentEmail,
                        remark: currentOrderCode
                    }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage(`订单已提交！订单号：${currentOrderCode}，管理员确认付款后将发送邀请。`, 'success');
                    emailInput.value = '';
                    checkQuota(); // 刷新库存显示
                } else {
                    showMessage(data.message || '提交失败，请稍后重试', 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '获取邀请';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            if (!email) return;

            hideMessage();
            submitBtn.disabled = true;
            submitBtn.textContent = '检查中...';

            // 先检查库存
            const hasQuota = await checkQuota();
            if (!hasQuota) {
                showMessage('当前名额已满，请稍后再试', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '获取邀请';
                return;
            }

            submitBtn.textContent = '请稍候...';
            openPaymentModal(email);
        });

        // 点击弹窗外部关闭
        paymentModal.addEventListener('click', (e) => {
            if (e.target === paymentModal) {
                closePaymentModal();
            }
        });

        // ESC 键关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && paymentModal.classList.contains('active')) {
                closePaymentModal();
            }
        });

        // 页面加载时检查库存
        checkQuota();
        
        // 每60秒刷新库存
        setInterval(checkQuota, 60000);
    </script>
</body>
</html>
