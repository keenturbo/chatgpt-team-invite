<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Team 邀请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="email"], input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .message.loading {
            background: #e7f1ff;
            color: #004085;
            display: block;
        }
        .message.warning {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal h2 {
            color: #333;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .modal .price {
            color: #e74c3c;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .modal .qrcode {
            width: 200px;
            height: 200px;
            margin: 0 auto 16px;
            border-radius: 8px;
            border: 2px solid #eee;
        }
        .modal .tips {
            color: #666;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.8;
        }
        .modal .tips strong {
            color: #e74c3c;
        }
        .order-code {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            padding: 12px 24px;
            border-radius: 8px;
            margin: 16px 0;
            font-family: 'Courier New', monospace;
        }
        .order-hint {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .modal .btn-group {
            display: flex;
            gap: 10px;
        }
        .modal .btn-group button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
        }
        .btn-cancel {
            background: #e0e0e0 !important;
            color: #333 !important;
        }
        .btn-cancel:hover {
            background: #d0d0d0 !important;
            box-shadow: none !important;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%) !important;
        }
        .btn-confirm:hover {
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ChatGPT Team</h1>
        <p class="subtitle">输入邮箱获取邀请链接</p>
        
        <form id="inviteForm">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com"
                    required
                >
            </div>
            <button type="submit" id="submitBtn">获取邀请</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="footer">
            提交后请查收邮件中的邀请链接
        </div>
    </div>

    <!-- 付款弹窗 -->
    <div id="paymentModal" class="modal-overlay">
        <div class="modal">
            <h2>扫码付款</h2>
            <div class="price">¥9.9</div>
            <img src="https://pic.icon.pp.ua/IMG_5235.jpeg" alt="收款码" class="qrcode">
            <div class="tips">
                请使用 <strong>支付宝</strong> 或 <strong>微信</strong> 扫码付款<br>
                付款时请备注下方订单号
            </div>
            <div class="order-hint">⚠️ 务必备注订单号，否则无法确认付款</div>
            <div class="order-code" id="orderCode">----</div>
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="closePaymentModal()">取消</button>
                <button type="button" class="btn-confirm" onclick="confirmPayment()">已完成付款</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('inviteForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const paymentModal = document.getElementById('paymentModal');
        const orderCodeDiv = document.getElementById('orderCode');

        let currentEmail = '';
        let currentOrderCode = '';

        // 生成4位订单号
        function generateOrderCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 去掉容易混淆的 I O 0 1
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        function hideMessage() {
            messageDiv.className = 'message';
        }

        function openPaymentModal(email) {
            currentEmail = email;
            currentOrderCode = generateOrderCode();
            orderCodeDiv.textContent = currentOrderCode;
            paymentModal.classList.add('active');
        }

        function closePaymentModal() {
            paymentModal.classList.remove('active');
            submitBtn.disabled = false;
            submitBtn.textContent = '获取邀请';
        }

        async function confirmPayment() {
            closePaymentModal();
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            showMessage('正在提交订单...', 'loading');

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email: currentEmail,
                        remark: currentOrderCode
                    }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage(`订单已提交！订单号：${currentOrderCode}，管理员确认付款后将发送邀请。`, 'success');
                    emailInput.value = '';
                } else {
                    showMessage(data.message || '提交失败，请稍后重试', 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '获取邀请';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            if (!email) return;

            hideMessage();
            submitBtn.disabled = true;
            submitBtn.textContent = '请稍候...';

            // 打开付款弹窗
            openPaymentModal(email);
        });

        // 点击弹窗外部关闭
        paymentModal.addEventListener('click', (e) => {
            if (e.target === paymentModal) {
                closePaymentModal();
            }
        });

        // ESC 键关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && paymentModal.classList.contains('active')) {
                closePaymentModal();
            }
        });
    </script>
</body>
</html>
