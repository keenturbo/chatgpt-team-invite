<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Team 邀请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="email"], input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .message.loading {
            background: #e7f1ff;
            color: #004085;
            display: block;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: modalIn 0.3s ease;
            margin: 20px auto;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal h2 {
            color: #333;
            margin-bottom: 6px;
            font-size: 20px;
        }
        .modal .price {
            color: #e74c3c;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        /* 支付方式选项卡 */
        .pay-tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 15px;
        }
        .pay-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .pay-tab:hover {
            color: #667eea;
        }
        .pay-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .pay-tab.wechat.active { color: #07c160; border-bottom-color: #07c160; }
        .pay-tab.alipay.active { color: #1677ff; border-bottom-color: #1677ff; }
        .pay-tab.hongbao.active { color: #ff6b35; border-bottom-color: #ff6b35; }
        
        /* 支付内容区 */
        .pay-content {
            display: none;
            padding: 10px 0;
        }
        .pay-content.active {
            display: block;
        }
        .qrcode-box {
            margin-bottom: 12px;
        }
        .qrcode-box img {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            border: 2px solid #eee;
        }
        .pay-tips {
            color: #666;
            font-size: 12px;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        .pay-tips strong {
            color: #e74c3c;
        }
        .mobile-tip {
            background: #e7f1ff;
            color: #004085;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 12px;
        }
        
        /* 口令红包输入 */
        .hongbao-input {
            margin: 15px 0;
        }
        .hongbao-input label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #333;
            margin-bottom: 6px;
        }
        .hongbao-input input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ff6b35;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            letter-spacing: 1px;
        }
        .hongbao-input input:focus {
            outline: none;
            border-color: #e55a2b;
        }
        .hongbao-steps {
            background: #fff8f5;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            color: #666;
            line-height: 1.8;
        }
        .hongbao-steps strong {
            color: #ff6b35;
        }
        
        /* 订单号显示 */
        .order-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            margin: 12px 0;
        }
        .order-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        .order-code {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            display: inline-block;
        }
        .order-hint {
            font-size: 11px;
            color: #e74c3c;
            margin-top: 6px;
        }
        
        .switch-tip {
            background: #fff3cd;
            color: #856404;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 12px;
        }
        
        .modal .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .modal .btn-group button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
        }
        .btn-cancel {
            background: #e0e0e0 !important;
            color: #333 !important;
        }
        .btn-cancel:hover {
            background: #d0d0d0 !important;
            box-shadow: none !important;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%) !important;
        }
        .btn-confirm:hover {
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4) !important;
        }
        
        .quota-info {
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }
        .quota-info.low {
            background: #fff3cd;
            color: #856404;
        }
        .quota-info.out {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ChatGPT Team</h1>
        <p class="subtitle">输入邮箱获取邀请链接</p>
        
        <div id="quotaInfo" class="quota-info" style="display: none;"></div>
        
        <form id="inviteForm">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com"
                    required
                >
            </div>
            <button type="submit" id="submitBtn">获取邀请</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="footer">
            提交后请查收邮件中的邀请链接
        </div>
    </div>

    <!-- 付款弹窗 -->
    <div id="paymentModal" class="modal-overlay">
        <div class="modal">
            <h2>选择支付方式</h2>
            <div class="price">¥9.9</div>
            
            <!-- 支付方式选项卡 -->
            <div class="pay-tabs">
                <button type="button" class="pay-tab wechat active" onclick="switchPayTab('wechat')">微信支付</button>
                <button type="button" class="pay-tab alipay" onclick="switchPayTab('alipay')">支付宝</button>
                <button type="button" class="pay-tab hongbao" onclick="switchPayTab('hongbao')">口令红包</button>
            </div>
            
            <!-- 微信支付 -->
            <div id="payWechat" class="pay-content active">
                <div class="qrcode-box">
                    <img src="https://pic.icon.pp.ua/wechat-pay.jpeg" alt="微信收款码">
                </div>
                <div class="mobile-tip">📱 手机用户：长按二维码保存，再用微信扫码</div>
                <div class="pay-tips">
                    扫码付款，备注 <strong>订单号</strong>（如无法备注可换其他方式）
                </div>
            </div>
            
            <!-- 支付宝 -->
            <div id="payAlipay" class="pay-content">
                <div class="qrcode-box">
                    <img src="https://pic.icon.pp.ua/alipay.jpeg" alt="支付宝收款码">
                </div>
                <div class="mobile-tip">📱 手机用户：长按二维码保存，再用支付宝扫码</div>
                <div class="pay-tips">
                    扫码付款，备注 <strong>订单号</strong>
                </div>
            </div>
            
            <!-- 口令红包 -->
            <div id="payHongbao" class="pay-content">
                <div class="hongbao-steps">
                    <strong>操作步骤：</strong><br>
                    1. 打开支付宝，搜索「口令红包」<br>
                    2. 发一个 <strong>¥10</strong> 的口令红包<br>
                    3. 复制口令，粘贴到下方输入框<br>
                    4. 点击「已完成付款」提交
                </div>
                <div class="hongbao-input">
                    <label>粘贴口令红包口令</label>
                    <input type="text" id="hongbaoCode" placeholder="粘贴口令红包的口令">
                </div>
                <div class="pay-tips" style="font-size: 11px; color: #999;">
                    口令红包无需备注订单号，系统自动关联
                </div>
            </div>
            
            <!-- 订单号（扫码支付显示） -->
            <div id="orderSection" class="order-section">
                <div class="order-label">您的订单号</div>
                <div class="order-code" id="orderCode">----</div>
                <div class="order-hint">扫码付款时请备注此订单号</div>
            </div>
            
            <div class="switch-tip">
                💡 微信无法备注？试试支付宝或口令红包
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="closePaymentModal()">取消</button>
                <button type="button" class="btn-confirm" onclick="confirmPayment()">已完成付款</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('inviteForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const paymentModal = document.getElementById('paymentModal');
        const orderCodeDiv = document.getElementById('orderCode');
        const orderSection = document.getElementById('orderSection');
        const quotaInfoDiv = document.getElementById('quotaInfo');
        const hongbaoCodeInput = document.getElementById('hongbaoCode');

        let currentEmail = '';
        let currentOrderCode = '';
        let currentPayMethod = 'wechat';

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        function hideMessage() {
            messageDiv.className = 'message';
        }

        // 切换支付方式
        function switchPayTab(method) {
            currentPayMethod = method;
            
            // 更新选项卡状态
            document.querySelectorAll('.pay-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelector(`.pay-tab.${method}`).classList.add('active');
            
            // 更新内容区
            document.querySelectorAll('.pay-content').forEach(content => content.classList.remove('active'));
            document.getElementById('pay' + method.charAt(0).toUpperCase() + method.slice(1)).classList.add('active');
            
            // 口令红包不需要显示订单号
            if (method === 'hongbao') {
                orderSection.style.display = 'none';
            } else {
                orderSection.style.display = 'block';
            }
        }

        // 检查库存
        async function checkQuota() {
            try {
                const response = await fetch('/api/quota');
                const data = await response.json();
                
                if (data.success) {
                    const quota = data.availableQuota;
                    if (quota <= 0) {
                        quotaInfoDiv.textContent = '⚠️ 当前名额已满，请稍后再试';
                        quotaInfoDiv.className = 'quota-info out';
                        quotaInfoDiv.style.display = 'block';
                        submitBtn.disabled = true;
                        submitBtn.textContent = '暂无名额';
                        return false;
                    } else if (quota <= 3) {
                        quotaInfoDiv.textContent = `🔥 剩余名额：${quota}，先到先得`;
                        quotaInfoDiv.className = 'quota-info low';
                        quotaInfoDiv.style.display = 'block';
                    } else {
                        quotaInfoDiv.style.display = 'none';
                    }
                    return true;
                }
                return true;
            } catch (error) {
                console.error('检查库存失败:', error);
                return true;
            }
        }

        // 生成订单号（备用，主要由后端生成）
        function generateOrderCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function openPaymentModal(email) {
            currentEmail = email;
            currentOrderCode = generateOrderCode();
            orderCodeDiv.textContent = currentOrderCode;
            hongbaoCodeInput.value = '';
            switchPayTab('wechat');
            paymentModal.classList.add('active');
        }

        function closePaymentModal() {
            paymentModal.classList.remove('active');
            submitBtn.disabled = false;
            submitBtn.textContent = '获取邀请';
        }

        async function confirmPayment() {
            // 口令红包需要填写口令
            let remark = currentOrderCode;
            if (currentPayMethod === 'hongbao') {
                const hongbaoCode = hongbaoCodeInput.value.trim();
                if (!hongbaoCode) {
                    alert('请填写口令红包的口令');
                    return;
                }
                remark = '口令:' + hongbaoCode;
            }
            
            closePaymentModal();
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            showMessage('正在提交订单...', 'loading');

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email: currentEmail,
                        remark: remark,
                        payMethod: currentPayMethod
                    }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    let successMsg = '订单已提交！';
                    if (currentPayMethod === 'hongbao') {
                        successMsg += '口令已记录，';
                    } else {
                        successMsg += `订单号：${currentOrderCode}，`;
                    }
                    successMsg += '管理员确认后将发送邀请。';
                    showMessage(successMsg, 'success');
                    emailInput.value = '';
                    checkQuota();
                } else {
                    showMessage(data.message || '提交失败，请稍后重试', 'error');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '获取邀请';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            if (!email) return;

            hideMessage();
            submitBtn.disabled = true;
            submitBtn.textContent = '检查中...';

            const hasQuota = await checkQuota();
            if (!hasQuota) {
                showMessage('当前名额已满，请稍后再试', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '获取邀请';
                return;
            }

            submitBtn.textContent = '请稍候...';
            openPaymentModal(email);
        });

        paymentModal.addEventListener('click', (e) => {
            if (e.target === paymentModal) {
                closePaymentModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && paymentModal.classList.contains('active')) {
                closePaymentModal();
            }
        });

        checkQuota();
        setInterval(checkQuota, 60000);
    </script>
</body>
</html>
