<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - ChatGPT Team 邀请</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #fff;
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .card h2 {
      color: #1a1a2e;
      margin-bottom: 20px;
      font-size: 18px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-danger {
      background: #e74c3c;
      color: white;
      padding: 8px 16px;
      font-size: 12px;
    }
    .btn-danger:hover {
      background: #c0392b;
    }
    .btn-success {
      background: #27ae60;
      color: white;
      padding: 8px 16px;
      font-size: 12px;
    }
    .btn-success:hover {
      background: #219a52;
    }
    .btn-warning {
      background: #f39c12;
      color: white;
      padding: 8px 16px;
      font-size: 12px;
    }
    .btn-warning:hover {
      background: #d68910;
    }
    .account-list, .order-list {
      margin-top: 20px;
    }
    .account-item, .order-item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .account-info, .order-info {
      flex: 1;
      min-width: 200px;
    }
    .account-name, .order-email {
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 5px;
    }
    .account-id, .order-meta {
      font-size: 12px;
      color: #666;
      font-family: monospace;
    }
    .account-quota {
      font-size: 14px;
      color: #667eea;
      font-weight: 500;
    }
    .order-remark {
      font-size: 13px;
      color: #333;
      margin-top: 4px;
    }
    .order-time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    .account-actions, .order-actions {
      display: flex;
      gap: 8px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-active {
      background: #d4edda;
      color: #155724;
    }
    .status-exhausted {
      background: #f8d7da;
      color: #721c24;
    }
    .status-pending {
      background: #fff3cd;
      color: #856404;
    }
    .status-confirmed {
      background: #d4edda;
      color: #155724;
    }
    .status-rejected {
      background: #f8d7da;
      color: #721c24;
    }
    .login-form {
      max-width: 400px;
      margin: 100px auto;
    }
    .hidden {
      display: none;
    }
    .message {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .message-success {
      background: #d4edda;
      color: #155724;
    }
    .message-error {
      background: #f8d7da;
      color: #721c24;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card.warning {
      background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
    }
    .stat-label {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 5px;
    }
    .logout-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .logout-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: #667eea;
      color: white;
    }
    .tab-btn:hover:not(.active) {
      background: #d0d0d0;
    }
    .badge {
      display: inline-block;
      background: #e74c3c;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 5px;
    }
    .empty-message {
      color: #666;
      text-align: center;
      padding: 20px;
    }
    .refresh-btn {
      float: right;
      padding: 6px 12px;
      font-size: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .refresh-btn:hover {
      background: #5a6fd6;
    }
  </style>
</head>
<body>
  <!-- 登录表单 -->
  <div id="loginSection" class="login-form">
    <div class="card">
      <h2>管理员登录</h2>
      <div id="loginMessage"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">登录</button>
      </form>
    </div>
  </div>

  <!-- 管理面板 -->
  <div id="adminSection" class="container hidden">
    <button class="logout-btn" onclick="logout()">退出登录</button>
    <h1>ChatGPT Team 邀请管理</h1>
    
    <!-- 统计卡片 -->
    <div class="stats">
      <div class="stat-card warning">
        <div class="stat-value" id="pendingOrders">0</div>
        <div class="stat-label">待确认订单</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalAccounts">0</div>
        <div class="stat-label">账号总数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeAccounts">0</div>
        <div class="stat-label">可用账号</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalQuota">0</div>
        <div class="stat-label">剩余名额</div>
      </div>
    </div>

    <!-- 待确认订单 -->
    <div class="card">
      <h2>
        订单管理
        <button class="refresh-btn" onclick="loadOrders()">刷新</button>
      </h2>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchOrderTab('pending')" id="tabPending">
          待确认 <span class="badge" id="pendingBadge">0</span>
        </button>
        <button class="tab-btn" onclick="switchOrderTab('confirmed')" id="tabConfirmed">已完成</button>
        <button class="tab-btn" onclick="switchOrderTab('rejected')" id="tabRejected">已拒绝</button>
      </div>
      <div id="orderMessage"></div>
      <div id="orderList" class="order-list">
        <p class="empty-message">暂无订单</p>
      </div>
    </div>

    <!-- 添加账号 -->
    <div class="card">
      <h2>添加账号</h2>
      <div id="addMessage"></div>
      <form id="addAccountForm">
        <div class="form-group">
          <label>账号名称（备注）</label>
          <input type="text" id="accountName" placeholder="如：主账号、备用1" required>
        </div>
        <div class="form-group">
          <label>ChatGPT Account ID</label>
          <input type="text" id="accountId" placeholder="fb127d59-bc70-4291-..." required>
        </div>
        <div class="form-group">
          <label>ChatGPT Token</label>
          <input type="text" id="accountToken" placeholder="eyJhbGciOiJSUzI1NiIs..." required>
        </div>
        <div class="form-group">
          <label>邀请名额（默认4）</label>
          <input type="number" id="accountQuota" value="4" min="1" max="10">
        </div>
        <button type="submit" class="btn btn-primary">添加账号</button>
      </form>
    </div>

    <!-- 账号列表 -->
    <div class="card">
      <h2>账号列表</h2>
      <div id="accountList" class="account-list">
        <p class="empty-message">暂无账号，请添加</p>
      </div>
    </div>
  </div>

  <script>
    let authToken = localStorage.getItem('adminToken');
    let currentOrderTab = 'pending';
    let allOrders = [];

    // 检查登录状态
    if (authToken) {
      showAdminPanel();
      loadData();
    }

    // 加载所有数据
    function loadData() {
      loadAccounts();
      loadOrders();
    }

    // 登录表单提交
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (data.success) {
          authToken = data.token;
          localStorage.setItem('adminToken', authToken);
          showAdminPanel();
          loadData();
        } else {
          showMessage('loginMessage', data.error || '登录失败', 'error');
        }
      } catch (err) {
        showMessage('loginMessage', '网络错误', 'error');
      }
    });

    // 添加账号表单提交
    document.getElementById('addAccountForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('accountName').value;
      const accountId = document.getElementById('accountId').value;
      const token = document.getElementById('accountToken').value;
      const quota = parseInt(document.getElementById('accountQuota').value) || 4;

      try {
        const res = await fetch('/api/admin/accounts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ name, accountId, token, quota })
        });
        const data = await res.json();
        
        if (data.success) {
          showMessage('addMessage', '账号添加成功', 'success');
          document.getElementById('addAccountForm').reset();
          document.getElementById('accountQuota').value = '4';
          loadAccounts();
        } else {
          showMessage('addMessage', data.error || '添加失败', 'error');
        }
      } catch (err) {
        showMessage('addMessage', '网络错误', 'error');
      }
    });

    // 加载订单列表
    async function loadOrders() {
      try {
        const res = await fetch('/api/admin/orders', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        
        if (data.success) {
          allOrders = data.orders || [];
          renderOrders();
          updateOrderStats();
        } else if (res.status === 401) {
          logout();
        }
      } catch (err) {
        console.error('加载订单失败:', err);
      }
    }

    // 切换订单标签
    function switchOrderTab(tab) {
      currentOrderTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
      renderOrders();
    }

    // 渲染订单列表
    function renderOrders() {
      const container = document.getElementById('orderList');
      const filteredOrders = allOrders.filter(o => o.status === currentOrderTab);
      
      if (!filteredOrders || filteredOrders.length === 0) {
        container.innerHTML = '<p class="empty-message">暂无订单</p>';
        return;
      }

      container.innerHTML = filteredOrders.map(order => {
        const statusClass = `status-${order.status}`;
        const statusText = {
          'pending': '待确认',
          'confirmed': '已完成',
          'rejected': '已拒绝'
        }[order.status] || order.status;
        
        const time = new Date(order.createdAt).toLocaleString('zh-CN');
        
        let actions = '';
        if (order.status === 'pending') {
          actions = `
            <button class="btn btn-success" onclick="confirmOrder('${order.id}')">确认付款</button>
            <button class="btn btn-danger" onclick="rejectOrder('${order.id}')">拒绝</button>
          `;
        }
        
        return `
          <div class="order-item">
            <div class="order-info">
              <div class="order-email">${escapeHtml(order.email)}</div>
              <div class="order-remark">备注: ${escapeHtml(order.remark || '无')}</div>
              <div class="order-time">${time}</div>
            </div>
            <span class="status-badge ${statusClass}">${statusText}</span>
            <div class="order-actions">
              ${actions}
            </div>
          </div>
        `;
      }).join('');
    }

    // 更新订单统计
    function updateOrderStats() {
      const pendingCount = allOrders.filter(o => o.status === 'pending').length;
      document.getElementById('pendingOrders').textContent = pendingCount;
      document.getElementById('pendingBadge').textContent = pendingCount;
      
      // 如果有待确认订单，显示提示
      if (pendingCount > 0) {
        document.getElementById('pendingBadge').style.display = 'inline-block';
      } else {
        document.getElementById('pendingBadge').style.display = 'none';
      }
    }

    // 确认订单
    async function confirmOrder(id) {
      if (!confirm('确认该用户已付款？将自动发送邀请邮件。')) return;
      
      try {
        const res = await fetch(`/api/admin/orders/${id}/confirm`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        
        if (data.success) {
          showMessage('orderMessage', '订单已确认，邀请已发送', 'success');
          loadOrders();
          loadAccounts(); // 刷新账号使用情况
        } else {
          showMessage('orderMessage', data.error || '确认失败', 'error');
        }
      } catch (err) {
        showMessage('orderMessage', '网络错误', 'error');
      }
    }

    // 拒绝订单
    async function rejectOrder(id) {
      if (!confirm('确定要拒绝这个订单吗？')) return;
      
      try {
        const res = await fetch(`/api/admin/orders/${id}/reject`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        
        if (data.success) {
          showMessage('orderMessage', '订单已拒绝', 'success');
          loadOrders();
        } else {
          showMessage('orderMessage', data.error || '操作失败', 'error');
        }
      } catch (err) {
        showMessage('orderMessage', '网络错误', 'error');
      }
    }

    // 加载账号列表
    async function loadAccounts() {
      try {
        const res = await fetch('/api/admin/accounts', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        
        if (data.success) {
          renderAccounts(data.accounts);
          updateStats(data.accounts);
        } else if (res.status === 401) {
          logout();
        }
      } catch (err) {
        console.error('加载账号失败:', err);
      }
    }

    // 渲染账号列表
    function renderAccounts(accounts) {
      const container = document.getElementById('accountList');
      
      if (!accounts || accounts.length === 0) {
        container.innerHTML = '<p class="empty-message">暂无账号，请添加</p>';
        return;
      }

      container.innerHTML = accounts.map(acc => {
        const remaining = acc.quota - acc.used;
        const isExhausted = remaining <= 0;
        const statusClass = isExhausted ? 'status-exhausted' : 'status-active';
        const statusText = isExhausted ? '已用完' : '可用';
        
        return `
          <div class="account-item">
            <div class="account-info">
              <div class="account-name">${escapeHtml(acc.name)}</div>
              <div class="account-id">ID: ${acc.accountId.substring(0, 8)}...</div>
              <div class="account-quota">名额: ${acc.used}/${acc.quota} 已使用</div>
            </div>
            <span class="status-badge ${statusClass}">${statusText}</span>
            <div class="account-actions">
              <button class="btn btn-success" onclick="resetQuota('${acc.id}')">重置</button>
              <button class="btn btn-danger" onclick="deleteAccount('${acc.id}')">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 更新统计
    function updateStats(accounts) {
      const total = accounts.length;
      const active = accounts.filter(a => a.enabled && (a.quota - a.used) > 0).length;
      const quota = accounts.reduce((sum, a) => sum + Math.max(0, a.quota - a.used), 0);
      
      document.getElementById('totalAccounts').textContent = total;
      document.getElementById('activeAccounts').textContent = active;
      document.getElementById('totalQuota').textContent = quota;
    }

    // 删除账号
    async function deleteAccount(id) {
      if (!confirm('确定要删除这个账号吗？')) return;
      
      try {
        const res = await fetch(`/api/admin/accounts/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        
        if (data.success) {
          loadAccounts();
        } else {
          alert(data.error || '删除失败');
        }
      } catch (err) {
        alert('网络错误');
      }
    }

    // 重置名额
    async function resetQuota(id) {
      if (!confirm('确定要重置这个账号的使用次数吗？')) return;
      
      try {
        const res = await fetch(`/api/admin/accounts/${id}/reset`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        
        if (data.success) {
          loadAccounts();
        } else {
          alert(data.error || '重置失败');
        }
      } catch (err) {
        alert('网络错误');
      }
    }

    // 显示管理面板
    function showAdminPanel() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminSection').classList.remove('hidden');
    }

    // 退出登录
    function logout() {
      localStorage.removeItem('adminToken');
      authToken = null;
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('adminSection').classList.add('hidden');
    }

    // 显示消息
    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.innerHTML = `<div class="message message-${type}">${escapeHtml(message)}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 3000);
    }

    // HTML转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 定时刷新订单（每30秒）
    setInterval(() => {
      if (authToken) {
        loadOrders();
      }
    }, 30000);
  </script>
</body>
</html>
